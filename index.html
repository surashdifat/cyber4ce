<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing Link Scanner | Cyber4ce</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="sura.css">
</head>
<body>

    <!-- ========== الخلفية التقنية ========== -->
    <div class="cyber-bg">
        <div class="bg-grid"></div>
        <div class="bg-glow bg-glow-1"></div>
        <div class="bg-glow bg-glow-2"></div>
    </div>

    <main class="container">

        <!-- ========== الهيدر ========== -->
        <header class="hero-section">
            
            <div class="hero-rings">
                <div class="ring ring-1"></div>
                <div class="ring ring-2"></div>
                <div class="ring ring-3"></div>
            </div>

            <div class="hero-shield">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L4 5V11C4 16 7.5 20.5 12 22C16.5 20.5 20 16 20 11V5L12 2Z" 
                          stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                    <path d="M9 12L11 14L15 10" 
                          stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>

            <div class="hero-orbit">
                <div class="orbit-item orbit-1" title="Links">
                    <svg viewBox="0 0 24 24" fill="none"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                </div>
                <div class="orbit-item orbit-2" title="Alerts">
                    <svg viewBox="0 0 24 24" fill="none"><path d="M12 9v4M12 17h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </div>
                <div class="orbit-item orbit-3" title="Lock">
                    <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="11" width="18" height="11" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 11V7a5 5 0 0110 0v4" stroke="currentColor" stroke-width="1.5"/></svg>
                </div>
                <div class="orbit-item orbit-4" title="Scan">
                    <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="1.5"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                </div>
            </div>

            <h1 class="hero-title">PHISHING LINK SCANNER</h1>
            <p class="hero-subtitle">Think before you click</p>
        </header>

        <!-- ========== قسم الإدخال ========== -->
        <section class="input-panel">
            <div class="panel-header">
                <span class="panel-dot"></span>
                <span class="panel-title">URL INPUT</span>
                <span class="panel-line"></span>
            </div>

            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="urlInput" 
                    placeholder="https://example.com"
                    autocomplete="off"
                >
                <button id="scanBtn">
                    <span>SCAN</span>
                </button>
            </div>
        </section>

        <!-- ========== Terminal Animation ========== -->
        <section class="terminal-panel" id="terminalPanel" style="display: none;">
            <div class="terminal-header">
                <div class="terminal-dots">
                    <span class="dot dot-red"></span>
                    <span class="dot dot-yellow"></span>
                    <span class="dot dot-green"></span>
                </div>
                <span class="terminal-title">cyber4ce@scanner: ~</span>
                <button class="skip-btn" id="skipBtn">
                    SKIP ⏭
                </button>
            </div>
            <div class="terminal-body" id="terminalBody"></div>
        </section>

        <!-- ========== قسم النتائج ========== -->
        <section class="result-panel" id="resultSection" style="display: none;">
            
            <div class="panel-header">
                <span class="panel-dot"></span>
                <span class="panel-title">ANALYSIS RESULT</span>
                <span class="panel-line"></span>
            </div>

            <div class="scanned-url">
                <span class="scanned-label">SCANNED URL</span>
                <span class="scanned-value" id="scannedUrl"></span>
            </div>

            <div class="alert-banner" id="alertBanner">
                <span class="alert-icon" id="alertIcon">⚠</span>
                <span class="alert-text" id="alertText">SCANNING...</span>
            </div>

            <div class="risk-section">
                <div class="risk-gauge">
                    <svg viewBox="0 0 200 200" class="gauge-svg">
                        <circle class="gauge-bg" cx="100" cy="100" r="85"></circle>
                        <circle class="gauge-fill" cx="100" cy="100" r="85" id="gaugeFill"></circle>
                    </svg>
                    <div class="gauge-content">
                        <span class="gauge-percent" id="riskPercent">0%</span>
                        <span class="gauge-label">THREAT LEVEL</span>
                    </div>
                </div>
            </div>

            <div class="reasons">
                <h3><span class="h3-marker">◆</span> DETECTED ISSUES</h3>
                <ul id="reasonsList"></ul>
            </div>

            <div class="advice" id="adviceBox">
                <p id="adviceText"></p>
            </div>

            <div class="result-actions">
                <button class="action-btn" id="copyBtn">
                    <svg viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="13" height="13" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1" stroke="currentColor" stroke-width="1.5"/></svg>
                    <span>COPY REPORT</span>
                </button>
                <button class="action-btn" id="clearBtn">
                    <svg viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                    <span>NEW SCAN</span>
                </button>
            </div>

        </section>

        <!-- ========== آخر الفحوصات ========== -->
        <section class="history-panel" id="historyPanel" style="display: none;">
            <div class="panel-header">
                <span class="panel-dot"></span>
                <span class="panel-title">RECENT SCANS</span>
                <span class="panel-line"></span>
            </div>
            <ul class="history-list" id="historyList"></ul>
        </section>

        <!-- ========== الفوتر ========== -->
        <footer class="page-footer">
            <span class="footer-line"></span>
            <span class="footer-dot"></span>
            <span class="footer-text">SECURE • ANALYZE • PROTECT</span>
            <span class="footer-dot"></span>
            <span class="footer-line"></span>
        </footer>

    </main>

    <script src="sura.js"></script>
</body>
</html>
